<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern</title>

    <style>

        body{
            font-family: Arial;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator{

            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);

        }

        h2{
            text-align: center;
            color: white;
        }

        #display{

            width: 100%;
            height: 60px;
            font-size: 28px;
            margin-bottom: 15px;
            text-align: right;
            padding-right: 10px;
            border: none;
            border-radius: 10px;

        }

        .buttons{

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;

        }

        button{

            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;

        }

        button:hover{
            transform: scale(1.05);
        }

        .number{
            background-color: #444;
            color: white;
        }

        .operator{
            background-color: orange;
            color: white;
        }

        .equal{
            background-color: green;
            color: white;
        }

        .clear{
            background-color: red;
            color: white;
        }

    </style>

</head>
<body>

    <div class="calculator">

        <h2>Kalkulator JavaScript</h2>

        <input type="text" id="display" disabled>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="tambahDisplay('/')">/</button>
            <button class="operator" onclick="tambahDisplay('*')">*</button>
            <button class="operator" onclick="hapusSatu()">⌫</button>

            <button class="number" onclick="tambahDisplay('7')">7</button>
            <button class="number" onclick="tambahDisplay('8')">8</button>
            <button class="number" onclick="tambahDisplay('9')">9</button>
            <button class="operator" onclick="tambahDisplay('-')">-</button>

            <button class="number" onclick="tambahDisplay('4')">4</button>
            <button class="number" onclick="tambahDisplay('5')">5</button>
            <button class="number" onclick="tambahDisplay('6')">6</button>
            <button class="operator" onclick="tambahDisplay('+')">+</button>

            <button class="number" onclick="tambahDisplay('1')">1</button>
            <button class="number" onclick="tambahDisplay('2')">2</button>
            <button class="number" onclick="tambahDisplay('3')">3</button>
            <button class="equal" onclick="hitung()">=</button>

            <button class="number" onclick="tambahDisplay('0')">0</button>
            <button class="number" onclick="tambahDisplay('.')">.</button>
            <button class="operator" onclick="tambahDisplay('%')">%</button>
            <button class="operator" onclick="akar()">√</button>

        </div>

    </div>

    <script>

        // Mengambil display
        let display = document.getElementById("display");

        // FUNCTION menambahkan angka/operator
        function tambahDisplay(input){

            display.value += input;

        }

        // FUNCTION clear
        function clearDisplay(){

            display.value = "";

        }

        // FUNCTION hapus satu karakter
        function hapusSatu(){

            display.value = display.value.slice(0, -1);

        }

        // FUNCTION hitung
        function hitung(){

            try{

                // eval digunakan untuk menghitung operasi matematika
                let hasil = eval(display.value);

                display.value = hasil;

            }
            catch(error){

                display.value = "Error";

            }

        }

        // FUNCTION akar kuadrat
        function akar(){

            try{

                let angka = Number(display.value);

                if(angka < 0){

                    display.value = "Tidak Valid";

                }
                else{

                    display.value = Math.sqrt(angka);

                }

            }
            catch(error){

                display.value = "Error";

            }

        }

        // Keyboard Support
        document.addEventListener("keydown", function(event){

            let tombol = event.key;

            // Jika angka/operator
            if(
                tombol >= 0 && tombol <= 9 ||
                tombol == "+" ||
                tombol == "-" ||
                tombol == "*" ||
                tombol == "/" ||
                tombol == "." ||
                tombol == "%"
            ){

                tambahDisplay(tombol);

            }

            // Enter untuk hitung
            else if(tombol == "Enter"){

                hitung();

            }

            // Backspace
            else if(tombol == "Backspace"){

                hapusSatu();

            }

            // Escape untuk clear
            else if(tombol == "Escape"){

                clearDisplay();

            }

        });

    </script>

</body>
</html>
